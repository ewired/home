[[actions]]
name = "append-file-to-working-desc"
lua = '''
local file = context.file()
if not file then
  flash({ text = "No file selected", error = true })
  return
end

-- Get current description for working revision
local current_desc, err = jj("log", "--no-graph", "-r", "@", "--template", "description")
if err then
  flash({ text = err, error = true })
  return
end

-- Create new description with @ prefix for the file
local new_desc
if current_desc and current_desc ~= "" then
  new_desc = current_desc:gsub("^%s*", ""):gsub("%s*$", "") .. " @" .. file
else
  new_desc = "@" .. file
end

-- Update the description of working revision
local _, describe_err = jj("describe", "-r", "@", "-m", new_desc)
if describe_err then
  flash({ text = describe_err, error = true })
  return
end

flash("Appended @" .. file .. " to @ description")
revisions.refresh()
'''

[[bindings]]
action = "append-file-to-working-desc"
key = "ctrl+f"
scope = "revisions.details"
desc = "append file to @ desc"

