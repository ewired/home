[[actions]]
name = "fix"
lua = '''
local ids = context.checked_commit_ids()
if #ids == 0 then
  flash({ text = "No checked commits", error = true })
  return
end
jj_async({ "fix", "-s", table.unpack(ids) })
revisions.refresh()
'''

[[bindings]]
action = "fix"
key = "F"
scope = "revisions"
desc = "fix checked commits"

