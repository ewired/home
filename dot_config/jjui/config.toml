[[actions]]
name = "opencode-send-attach"
lua = '''
local change_id = context.change_id()
if not change_id then
  flash({ text = "No change selected", error = true })
  return
end

local description, err = jj("log", "--no-graph", "-r", change_id, "--template", "description")
if not description or err then
  exec_shell("jj opencode-send-attach " .. change_id)
else
  if string.match(description, "^: .+") then
    exec_shell("jj opencode-send-attach " .. change_id)
  else
    jj_interactive("opencode-send-attach", change_id)
  end
end
revisions.refresh()
'''

[[bindings]]
action = "opencode-send-attach"
key = "O"
scope = "revisions"
desc = "opencode send and attach"

