[[actions]]
name = "nobs"
lua = '''
local change_id = context.change_id()
if not change_id then
  flash({ text = "No change selected", error = true })
  return
end

local description, err = jj("log", "--no-graph", "-r", change_id, "--template", "description")
if description and description ~= "" and not err then
  -- Session markers that jj may prefix a description with: `:ID: ` (ids are
  -- uuids, so dashes are allowed -- see the [a-zA-Z0-9_-]+ grammars in
  -- ~/.config/jj/config.toml) and the `:: ` no-id placeholder.
  local function strip_id_markers(desc)
    while true do
      local stripped = (desc:gsub("^:: ", ""):gsub("^:[a-zA-Z0-9_-]+: ", ""))
      if stripped == desc then return desc end
      desc = stripped
    end
  end

  -- A description is already a prompt-description when it starts with the
  -- prompt marker ": " and no jj marker follows it; anything else -- including
  -- ": :ID: text" leftovers from the pre-dash pattern -- is rewritten instead
  -- of launching nobs. Prefix checks only (never `.`/`$` patterns), so
  -- multi-line descriptions are handled the same as single-line ones.
  local function is_prompt_description(desc)
    return desc:sub(1, 2) == ": " and strip_id_markers(desc:sub(3)) == desc:sub(3)
  end

  if not is_prompt_description(description) then
    local body = (description:gsub("^: ", ""))
    jj("describe", "-r", change_id, "-m", ": " .. strip_id_markers(body))
    revisions.refresh()
    return
  end
end

-- Description is empty or already a prompt-description: launch nobs
exec_shell("jj nobs " .. change_id)
revisions.refresh()
'''

[[bindings]]
action = "nobs"
key = "O"
scope = "revisions"
desc = "run nobs on selected change"

