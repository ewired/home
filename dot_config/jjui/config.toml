[[actions]]
name = "diff-to-working"
lua = '''
local change_id = context.change_id()
if not change_id then
  flash({ text = "No change selected", error = true })
  return
end
local file = context.file()
local output, err
if file then
  output, err = jj("diff", "-r", change_id .. "::@", "--", file)
else
  output, err = jj("diff", "-r", change_id .. "::@")
end
if err then
  flash({ text = err, error = true })
else
  diff.show(output)
end
'''

[[bindings]]
action = "diff-to-working"
key = "ctrl+d"
scope = "revisions"
desc = "diff to working"

[[bindings]]
action = "diff-to-working"
key = "ctrl+d"
scope = "revisions.details"
desc = "diff file to working"

[[actions]]
name = "editor"
lua = '''
local files = context.checked_files()
if #files == 0 then
  local file = context.file()
  if file then
    files = { file }
  end
end
if #files == 0 then
  flash({ text = "No files selected", error = true })
  return
end
table.sort(files)
for i = 1, math.floor(#files / 2) do
  files[i], files[#files - i + 1] = files[#files - i + 1], files[i]
end
local cmd = "jj edit-with-lines"
for _, file in ipairs(files) do
  cmd = cmd .. " " .. string.format("%q", file)
end
exec_shell(cmd)
'''

[[bindings]]
action = "editor"
key = "ctrl+e"
scope = "revisions.details"
desc = "edit selected files"

[[actions]]
name = "leader-edit-file-in-working"
lua = '''
local file = context.file()
if not file then
  flash({ text = "No file selected", error = true })
  return
end
local editor = os.getenv("EDITOR")
if not editor or editor == "" then
  flash({ text = "$EDITOR is not set", error = true })
  return
end
exec_shell(string.format("%s %q", editor, file))
'''

[[bindings]]
action = "leader-edit-file-in-working"
seq = ["\\", "e"]
scope = "revisions.details"
desc = "Edit file in @"

[[actions]]
name = "leader-edit-file-in-change"
lua = '''
local file = context.file()
local change_id = context.change_id()
if not file or not change_id then
  flash({ text = "Need file and change selected", error = true })
  return
end
local editor = os.getenv("EDITOR")
if not editor or editor == "" then
  flash({ text = "$EDITOR is not set", error = true })
  return
end
exec_shell(string.format("jj edit %q && %s %q", change_id, editor, file))
revisions.refresh()
'''

[[bindings]]
action = "leader-edit-file-in-change"
seq = ["\\", "E"]
scope = "revisions.details"
desc = "Edit file in change"
