"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[ui]
diff-formatter = ["difft", "--color=always", "$left", "$right"]

[user]
name = "ewired"
email = "ewired@tuyuji.com"

[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/id_rsa.pub"

[templates]
draft_commit_description = '''
  concat(
    coalesce(description, default_commit_description, "\n"),
    surround(
      "\nJJ: This commit contains the following changes:\n", "",
      indent("JJ:     ", diff.stat(72)),
    ),
    "\nJJ: ignore-rest\n",
    diff.git(),
  )
'''
log_node = '''
if(self && !current_working_copy && !immutable && !conflict && in_branch(self),
  "◇",
  builtin_log_node
)
'''


[template-aliases]
"in_branch(commit)" = 'commit.contained_in("immutable_heads()..bookmarks()")'
"format_timestamp(timestamp)" = "timestamp.ago()"
'format_short_commit_header(commit)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  if(commit.empty(), "",
    label("diff added", "+" ++ commit.diff().stat().total_added())
        ++
        label("diff removed", "-" ++ commit.diff().stat().total_removed())),
  if(commit.mine(), "",
    format_short_signature(commit.author())),
  format_timestamp(commit_timestamp(commit)),
  commit.bookmarks(),
  commit.tags(),
  commit.working_copies(),
  format_short_commit_id(commit.commit_id()),
  format_commit_labels(commit),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''


[aliases]
agent-prompt = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

rev=${1:-@}
description=$(jj log --no-graph -r "$rev" --template 'description')
prompt_text=""

# The trail is anchored at the working copy: nobs-prepare checks out the
# target change (`jj edit "$rev"`) before calling this alias, so @ == rev and
# agent_job_trail() (defined against @) is exactly equivalent to the
# previous `latest(::<rev>- & ~description(...))::<rev>` expansion.
trail_revset='agent_job_trail()'

if [ -n "$description" ]; then
  clean_description=$(echo "$description" | sed -E 's/^:[a-zA-Z0-9_-]+: *//; s/^:: //; s/^: //')
  if [ -n "$clean_description" ]; then
    if [ -n "$(jj diff --git -r "$trail_revset")" ]; then
      prompt_text="# Instructions:\n\n$clean_description"
    else
      prompt_text=$(echo "$clean_description" | sed '/./,$!d')
    fi
  fi
else
  todos=$(jj find-todos "$trail_revset")
  if [ -z "$todos" ]; then
    echo "No instructions or TODOs to send" 1>&2
    exit 1
  fi
  prompt_text="# Instructions\n\nAddress these TODOs that were added in the changes:\n\n$todos"
fi

if [ -z "$prompt_text" ]; then
  # Nothing meaningful to send (empty description, no TODOs): stay quiet.
  exit 0
fi

tmpfile=$(mktemp) || exit 1
trap 'rm -f "$tmpfile"' EXIT
jj diff --git -r "$trail_revset" > "$tmpfile"
truncated=0
if [ "$(wc -l < "$tmpfile")" -gt 500 ]; then
  jj diff --summary -r "$trail_revset" > "$tmpfile"
  truncated=1
fi
if [ -s "$tmpfile" ]; then
  printf '# Changes already applied\n#\n# The diff below has already been applied to the working copy.\n# We are working on top of these changes; do not re-apply them.\n\n'
  if [ "$truncated" -eq 1 ]; then
    printf '# NOTE: The full diff is too large and only a summary is shown here.\n# Use `jj diff` to explore the actual changes.\n#\n'
    printf '#   jj diff --git -r %s%s%s\n#\n' "'" "$trail_revset" "'"
    printf '# To inspect a specific file, pass it as a positional argument:\n#\n'
    printf '#   jj diff --git -r %s%s%s <path>\n#\n' "'" "$trail_revset" "'"
    printf '# Multiple paths are accepted, and paths are relative to the repo root.\n#\n'
    printf '# The revset `%s` selects the work already done for the current task:\n' "$trail_revset"
    printf '# the range from the most recent non-instruction ancestor (inclusive)\n'
    printf '# up to the working copy (inclusive).\n\n'
  fi
  cat "$tmpfile"
  conflicts=$(jj resolve -l 2>/dev/null || true)
  if [ -n "$conflicts" ]; then
    printf '\n# Unresolved conflicts\n#\n# The following files have conflicts that need to be resolved:\n\n%s\n' "$conflicts"
  fi
  printf '\n%s\n' "$prompt_text"
else
  printf '%s\n' "$prompt_text"
fi
""", ""]

agent-files = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail
jj newhunks 'agent_job_trail()'
""", ""]

agent-submit-description = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

description=$(jj log --no-graph -r @ --template 'description')

if [ -n "$description" ]; then
  clean_description=$(echo "$description" | sed -E 's/^:[a-zA-Z0-9_-]+: *//; s/^:: //; s/^: //')
  printf ':: %s\n' "$clean_description"
else
  todos=$(jj find-todos 'agent_job_trail()')
  if [ -n "$todos" ]; then
    printf ':: Address TODOs in changes:\n\n%s\n' "$todos"
  fi
fi
""", ""]

nobs-prepare = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

rev=${1:-@}
jj edit "$rev" >/dev/null 2>&1 || true

# Resolve the session: a `:ID:` prefix on this change resumes that id; a
# blank change stacked on a session commit resumes the parent's id (only
# when this change has no description); otherwise mint a new one, record it
# in the description (`:UUID: description`), and mark "new".
current=$(jj log --no-graph -r @ --template 'description' 2>/dev/null || true)
session_id=$(printf '%s\n' "$current" | sed -nE 's/^:([a-zA-Z0-9_-]+): *.*/\\1/p' | head -1)
status=resumed
if [ -z "$session_id" ] && [ -z "$(printf '%s' "$current" | tr -d '[:space:]')" ]; then
  parent=$(jj log --no-graph -r @- --template 'description' 2>/dev/null || true)
  session_id=$(printf '%s\n' "$parent" | sed -nE 's/^:([a-zA-Z0-9_-]+): *.*/\\1/p' | head -1)
fi
if [ -z "$session_id" ]; then
  status=new
  session_id=$(uuidgen | tr '[:upper:]' '[:lower:]')
  submit_msg=$(jj agent-submit-description)
  submit_msg=$(printf '%s' "$submit_msg" | sed "s/^:: /:$session_id: /")
  if [ -z "$submit_msg" ]; then
    # Nothing to send (no description, no TODOs): still stamp the bare
    # :ID: marker so the commit stays bound to the new session.
    submit_msg=":$session_id:"
  fi
  jj describe -m "$submit_msg" >/dev/null 2>&1 || true
fi

# Build the message: attach the job trail's hunks as --file arguments, then
# the prompt (or TODOs) as the first message.
prompt=$(jj agent-prompt "$rev") || prompt=""
files=()
while IFS= read -r hunk; do
  [ -n "$hunk" ] || continue
  files+=("$hunk")
done < <(jj agent-files 2>/dev/null)

# Emit NUL-separated fields: session id, new|resumed, prompt, then files.
printf '%s\\0' "$session_id" "$status" "$prompt" "${files[@]}"
""", ""]

nobs = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

prepared=()
while IFS= read -r -d '' field; do
  prepared+=("$field")
done < <(jj nobs-prepare "${1:-@}")

session_id=${prepared[0]:-}
status=${prepared[1]:-}
prompt=${prepared[2]:-}
files=("${prepared[@]:3}")

if [ -z "$session_id" ]; then
  echo "nobs-prepare failed to resolve a session" 1>&2
  exit 1
fi

if [ "$status" = "resumed" ]; then
  # Continue the existing session in the TUI; no message to send.
  nobs --session "$session_id"
  exit $?
fi

# New session: launch the TUI with the prompt (or TODOs) as the first message.
args=(--session "$session_id")
if [ -n "$prompt" ]; then
  args+=(-p "$prompt")
fi
for file in "${files[@]}"; do
  args+=(--file "$file")
done
nobs "${args[@]}"
""", ""]

nobs-run = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

prepared=()
while IFS= read -r -d '' field; do
  prepared+=("$field")
done < <(jj nobs-prepare "${1:-@}")

session_id=${prepared[0]:-}
prompt=${prepared[2]:-}
files=("${prepared[@]:3}")

if [ -z "$session_id" ]; then
  echo "nobs-prepare failed to resolve a session" 1>&2
  exit 1
fi

# One-shot: submit the prompt and exit when done (yields back to callers).
args=(--run --session "$session_id")
if [ -n "$prompt" ]; then
  args+=(-p "$prompt")
fi
for file in "${files[@]}"; do
  args+=(--file "$file")
done
nobs "${args[@]}"
""", ""]

# https://isaaccorbrey.com/notes/jujutsu-megamerges-for-fun-and-profit#tldr
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]
stage = ["stack", "closest_merge(@)+:: ~ empty()"]
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents"]
# Like `restack`, but if trunk() conflicts, binary-searches trunk history for the newest ancestor that rebases cleanly (https://docs.jj-vcs.dev/latest/cli-reference/#jj-bisect).
restack-safe = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail
SRC='roots(trunk()..) & mutable()'
RANGE='(roots(trunk()..) & mutable())-..trunk()'
precheck=$(jj --no-integrate-operation rebase -s "$SRC" -o 'trunk()' 2>&1 || true)
case "$precheck" in
  *"New conflicts"*) ;;
  *) jj rebase -s "$SRC" -o 'trunk()' --simplify-parents; exit 0 ;;
esac
pre=$(jj op log -n1 --no-graph -T 'id')
bad=$(jj bisect run --range "$RANGE" -- bash -c 'o=$(jj --no-integrate-operation rebase -s "roots(trunk()..) & mutable()" -o "$JJ_BISECT_TARGET" 2>&1); case "$o" in *"New conflicts"*) exit 1;; *) exit 0;; esac' 2>&1 | sed -nE 's/^The first bad revision is: ([^ ]+).*/\\1/p')
jj op restore "$pre" >/dev/null 2>&1
if [ -z "$bad" ]; then
  jj rebase -s "$SRC" -o 'trunk()' --simplify-parents
else
  jj rebase -s "$SRC" -o "$bad-" --simplify-parents
fi
"""]

agent-jobs = ["log", "--no-graph", "--reversed", "--template", 'change_id ++ "\n"', "-r", "agent_job()"]

newhunks = ["util", "exec", "--", "uv", "run", "--no-project", "--quiet", "python3", "-c", '''
"""Merge the changed-line segments of a diff into contiguous blocks.

Reads `jj diff --git -r REV` and prints one line per block in
`path:START-END` form (or a bare `path` when the whole file should be
attached). Replaces the old awk one-segment-per-hunk behavior, which could
attach 20+ windows of the same file.

Tunables (env vars):
  JJ_HUNKS_CONTEXT  padding added around each hunk before merging (default 4)
  JJ_HUNKS_GAP      blocks closer than this many lines are merged (default 20)
  JJ_HUNKS_WHOLE    fraction of the file covered above which the whole file
                    is attached instead of individual blocks (default 0.8)
"""
import os
import re
import subprocess
import sys

HUNK_RE = re.compile(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@')
DIFF_RE = re.compile(r'^diff --git ')


def file_total_lines(rev: str, path: str) -> int | None:
    """Line count of `path` on the diff's new side.

    `jj diff -r RANGE` compares a range against its head, so resolve the
    head with `latest(REV)` (a range may not be given to `jj file show`);
    fall back to plain REV and to the old `jj cat` spelling.
    """
    for target in (f'latest({rev})', rev):
        for cmd in (
            ['jj', 'file', 'show', '-r', target, '--', path],
            ['jj', 'cat', '-r', target, '--', path],
        ):
            result = subprocess.run(
                cmd, capture_output=True, text=True, check=False
            )
            if result.returncode == 0:
                break
        else:
            continue
        break
    else:
        return None
    if not result.stdout:
        return 0
    # Count lines whether or not the file ends with a newline.
    return result.stdout.count('\n') + (
        0 if result.stdout.endswith('\n') else 1
    )


def main() -> None:
    rev = sys.argv[1] if len(sys.argv) > 1 else '@'
    context = int(os.environ.get('JJ_HUNKS_CONTEXT', '4'))
    gap = int(os.environ.get('JJ_HUNKS_GAP', '20'))
    whole = float(os.environ.get('JJ_HUNKS_WHOLE', '0.8'))

    diff = subprocess.run(
        ['jj', 'diff', '--git', '-r', rev],
        capture_output=True,
        text=True,
        check=True,
    ).stdout

    # path -> (is_new_file, [new-side (start, end) hunks])
    files: dict[str, tuple[bool, list[tuple[int, int]]]] = {}
    order: list[str] = []
    path = None
    for line in diff.splitlines():
        if DIFF_RE.match(line) and ' b/' in line:
            path = line.rsplit(' b/', 1)[1]
            files.setdefault(path, (False, []))
            order.append(path)
        elif path is not None and line.startswith('@@'):
            m = HUNK_RE.match(line)
            if not m:
                continue
            is_new = m.group(1) == '0' and (m.group(2) or '1') == '0'
            new_start = int(m.group(3))
            new_count = int(m.group(4) or '1')
            _, hunks = files[path]
            if new_count == 0:
                continue  # deletion-only hunk: nothing on the new side to attach
            if is_new:
                files[path] = (True, hunks)  # whole file is new
                continue
            hunks.append((new_start, new_start + new_count - 1))

    out = []
    for path in order:
        is_new, hunks = files[path]
        if is_new:
            out.append(path)  # attachments without ranges mean 'whole file'
            continue
        if not hunks:
            continue
        total = file_total_lines(rev, path)
        if total:
            padded = [(max(1, s - context), min(total, e + context)) for s, e in hunks]
        else:
            padded = [(s - context, e + context) for s, e in hunks]
        padded.sort()
        merged = []
        for s, e in padded:
            if merged and s <= merged[-1][1] + gap:
                merged[-1] = (merged[-1][0], max(merged[-1][1], e))
            else:
                merged.append((s, e))
        if total:
            covered = sum(e - s + 1 for s, e in merged)
            if covered / total >= whole:
                out.append(path)
                continue
        out.extend(f'{path}:{s}-{e}' for s, e in merged)
    print('\n'.join(out))


if __name__ == '__main__':
    main()
''']

nobs-run-all = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

while true; do
  target_change=$(jj agent-jobs | head -n 1)
  if [ -z "$target_change" ]; then
    echo "No more nobs jobs remaining" 1>&2
    break
  fi
  echo "Running nobs-run on: $target_change"
  jj nobs-run "$target_change"
done
""", ""]

find-todos = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

jj diff --git -r "${1:-@}" --context 0 | awk '/^\\+/ && !/^\\+\\+\\+ / && (/TODO/ || /FIXME/) {print}'
""", ""]

edit-with-lines = ["util", "exec", "--", "bash", "-c", """
#!/usr/bin/env bash
set -euo pipefail

# Build editor arguments from modified files or use provided files
editor_args=""
for file in "$@"; do
  line=$(jj diff -r "latest(files('$file') & ::@)" --git --context 0 "$file" | awk '
    /^@@/ && !found {
      if (match($0, /@@ -([0-9]+)(,([0-9]+))? \\+([0-9]+)(,([0-9]+))? @@/, arr)) {
        print arr[4]
        found = 1
      }
    }')
  if [ -n "$line" ]; then
    editor_args="$editor_args $file:$line"
  else
    editor_args="$editor_args $file"
  fi
done

${EDITOR:-vim} $editor_args
""", ""]

[revset-aliases]
# A pending instruction commit: empty, mutable, described with the `: ` prefix.
# Intersect only; `::~empty()` parses as a range and would subtract the jobs.
'agent_job()' = 'mutable() & empty() & description(regex:"^: ")'
'agent_job_trail()' = 'latest(::@- & ~description(regex:"^(:: |:[a-zA-Z0-9_-]+: )"))::@'
"closest_merge(to)" = "heads(::to & merges())" # https://isaaccorbrey.com/notes/jujutsu-megamerges-for-fun-and-profit#tldr
